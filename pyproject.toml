[project]
name = "american-sign-language"
version = "0.1.0"
description = "Two-way American Sign Language tool: ASL video to text and text/voice to ASL GIF."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.8.0",
    "numpy>=1.26,<2",
    "opencv-python>=4.9,<4.11",
    "pillow==11.3.0",
    "mediapipe==0.10.21",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
