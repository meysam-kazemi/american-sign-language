[project]
name = "american-sign-language"
version = "0.2.0"
description = "Two-way ASL fingerspelling MVP: camera signs to text and text or voice to GIF."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.8.0",
    "numpy>=1.26,<2",
    "opencv-contrib-python>=4.9,<4.12",
    "pillow==11.3.0",
    "mediapipe==0.10.21",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.7,<3",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
