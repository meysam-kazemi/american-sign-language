services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Trained model artifacts (gitignored); mount so the container can load them.
      - ./models:/app/models:ro

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
